spring.application.name=Advance_Performance_module
spring.profiles.active=dev
server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:ASCEND_PERFORMANCE_SUPER_SECURE_JWT_SECRET_KEY_2026_PROD}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jpa.open-in-view=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ===================================================================
# Spring Boot Actuator & Monitoring Configuration
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,env
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.health.mail.enabled=false
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Application Metadata for /actuator/info
info.app.name=ASCEND Enterprise Performance Management Suite
info.app.description=Production-ready OKR/KPI appraisal and employee lifecycle platform
info.app.version=0.0.1-SNAPSHOT
info.app.author=ASCEND Platform Engineering Team

# ===================================================================
# Google OAuth 2.0 Client Configuration
# ===================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.oauth2.authorized-redirect-uri=${FRONTEND_OAUTH_REDIRECT_URI:http://localhost:3000/login}