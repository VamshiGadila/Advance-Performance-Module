spring.application.name=Advance_Performance_module
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev,local}
server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:ASCEND_PERFORMANCE_SUPER_SECURE_JWT_SECRET_KEY_2026_PROD}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jpa.open-in-view=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# =====================================================
# Google OAuth 2.0 Client Configuration
# =====================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.oauth2.authorized-redirect-uri=${FRONTEND_OAUTH_REDIRECT_URI:http://localhost:3000/login}