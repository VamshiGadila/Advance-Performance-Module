# ===================================================================
# ASCEND Performance Module - Development Profile (application-dev.properties)
# SAFE TO COMMIT: No hardcoded passwords or credentials
# ===================================================================

# Database Connection (Reads from environment; fallback to empty password)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/advance_ascend_performance}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Development Sizing)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=AscendDevHikariPool

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration (Local Next.js & Vite Dev Servers)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging Configuration
logging.level.root=INFO
logging.level.com.practice.springbootdemo.ascend_performance=DEBUG
logging.level.org.springframework.security=DEBUG