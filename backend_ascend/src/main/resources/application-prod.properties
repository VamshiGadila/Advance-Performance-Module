# ===================================================================
# ASCEND Performance Module - Production Profile (application-prod.properties)
# SAFE TO COMMIT: Strict Fail-Fast (requires environment variables)
# ===================================================================

# Database Connection (Environment Variables with separate PostgreSQL prod database fallback)
spring.datasource.url=${PROD_DB_URL:jdbc:postgresql://localhost:5432/advance_ascend_prod}
spring.datasource.username=${PROD_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${PROD_DB_PASSWORD:${DB_PASSWORD:1234}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (High-Concurrency Production Sizing)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=AscendProdHikariPool

# JPA / Hibernate Configuration (Schema Validation / Production safe)
spring.jpa.hibernate.ddl-auto=${PROD_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS Configuration (Strict Production Domain with local fallback)
app.cors.allowed-origins=${PROD_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://app.ascend-performance.com}

# Actuator Health Security
management.endpoint.health.show-details=always

# Minimal Production Logging (Avoids leaking sensitive data in logs)
logging.level.root=WARN
logging.level.com.practice.springbootdemo.advance_performance_module=INFO
logging.level.org.springframework.security=WARN

# Production Mail Dispatch
spring.mail.host=${PROD_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${PROD_MAIL_PORT:587}
spring.mail.username=${PROD_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${PROD_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from-name=${PROD_MAIL_FROM_NAME:ASCEND Performance Suite}

# Production JWT Secret
app.jwt.secret=${PROD_JWT_SECRET:${JWT_SECRET:ASCEND_PERFORMANCE_SUPER_SECURE_JWT_SECRET_KEY_2026_PROD}}

# Production Google OAuth 2.0
spring.security.oauth2.client.registration.google.client-id=${PROD_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}}
spring.security.oauth2.client.registration.google.client-secret=${PROD_GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:your-google-client-secret}}