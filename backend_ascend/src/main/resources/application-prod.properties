# ===================================================================
# ASCEND Performance Module - Production Profile (application-prod.properties)
# SAFE TO COMMIT: Strict Fail-Fast (requires environment variables)
# ===================================================================

# Database Connection (Mandatory Production Environment Variables - No Fallbacks)
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (High-Concurrency Production Sizing)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=AscendProdHikariPool

# JPA / Hibernate Configuration (Schema Validation Only)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# CORS Configuration (Strict Production Domain)
app.cors.allowed-origins=${PROD_CORS_ALLOWED_ORIGINS:https://app.ascend-performance.com}

# Minimal Production Logging (Avoids leaking sensitive data in logs)
logging.level.root=WARN
logging.level.com.practice.springbootdemo.ascend_performance=INFO
logging.level.org.springframework.security=WARN