# ===================================================================
# ASCEND Performance Module - Test Profile (application-test.properties)
# Used for automated unit and integration tests (Zero external DB dependency)
# ===================================================================

# In-Memory H2 Database
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:ascend_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate for In-Memory Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Test Secret
app.jwt.secret=${TEST_JWT_SECRET:${JWT_SECRET:ASCEND_PERFORMANCE_TEST_SUPER_SECURE_JWT_SECRET_KEY_2026_TEST_SUITE_1234567890}}
app.jwt.expiration-ms=${TEST_JWT_EXPIRATION_MS:3600000}

# Actuator for Test Profile
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,env
management.endpoint.health.show-details=always

# OAuth 2.0 Mock Settings for Test Profile
spring.security.oauth2.client.registration.google.client-id=${TEST_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID:test-google-client-id}}
spring.security.oauth2.client.registration.google.client-secret=${TEST_GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:test-google-client-secret}}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.oauth2.authorized-redirect-uri=${TEST_FRONTEND_OAUTH_REDIRECT_URI:http://localhost:3000/login}

# Logging
logging.level.root=WARN
logging.level.com.practice.springbootdemo.advance_performance_module=INFO
