<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1750" width="1250" height="1750" style="background:#09090b; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="50" y="30" width="1150" height="90" rx="16" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="625" y="70" text-anchor="middle" fill="url(#headerGrad)" font-size="25" font-weight="800" letter-spacing="0.5">FORGOT PASSWORD, GMAIL OTP &amp; PASSWORD RESET LIFECYCLE</text>
  <text x="625" y="98" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="500">ASCEND Enterprise Security • Next.js 16 Multi-Step Client • Spring Boot 3 • Google SMTP • PostgreSQL</text>

  <!-- ================= STAGE 1: INITIATE REQUEST ================= -->
  <!-- 1. Client Step 1 Box -->
  <g transform="translate(325, 150)">
    <rect width="600" height="75" rx="14" fill="url(#primaryGrad)" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="300" y="33" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">📱 Step 1: User Submits Email (/forgot-password)</text>
    <text x="300" y="58" text-anchor="middle" fill="#e0e7ff" font-size="13" font-family="monospace">POST /api/auth/forgot-password • Payload: { "email": "user@gmail.com" }</text>
  </g>

  <!-- Line 1 to 2 -->
  <line x1="625" y1="225" x2="625" y2="255" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Subgraph 1: Spring Boot OTP Generation -->
  <rect x="75" y="260" width="1100" height="420" rx="20" fill="#0f0f13" stroke="rgba(99,102,241,0.3)" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="105" y="295" fill="#818cf8" font-size="15" font-weight="700" letter-spacing="1">PHASE 1: SECURE CRYPTOGRAPHIC OTP GENERATION &amp; GOOGLE SMTP DISPATCH</text>

  <!-- 2. AuthController & Service -->
  <g transform="translate(115, 315)">
    <rect width="1020" height="85" rx="12" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="85" rx="4" fill="#6366f1"/>
    <text x="30" y="30" fill="#f8fafc" font-size="16" font-weight="700">1. AuthController &amp; AuthService.forgotPassword()</text>
    <rect x="440" y="12" width="220" height="22" rx="6" fill="rgba(99,102,241,0.2)" stroke="#818cf8"/>
    <text x="550" y="27" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="700">@Transactional / Public</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="13">• Look up user: <tspan fill="#a5b4fc" font-family="monospace">userRepository.findByEmailIgnoreCase(email)</tspan></text>
    <text x="30" y="75" fill="#cbd5e1" font-size="13">• Prevents user enumeration (Returns generic success message even if email is unassigned)</text>
  </g>

  <!-- Line to Diamond 1 -->
  <line x1="625" y1="400" x2="625" y2="430" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Diamond 1: Is User Active? -->
  <g transform="translate(625, 470)">
    <path d="M 0 -35 L 140 0 L 0 35 L -140 0 Z" fill="url(#diamondGrad)" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Is User Found</text>
    <text x="0" y="14" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="700">&amp; Active = true?</text>
  </g>

  <!-- Diamond 1 No: Exit Safely -->
  <line x1="485" y1="470" x2="260" y2="470" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="130" y="445" width="120" height="50" rx="8" fill="#18181b" stroke="#f87171" stroke-width="1.5"/>
  <text x="190" y="466" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">NO (Silent Return)</text>
  <text x="190" y="484" text-anchor="middle" fill="#94a3b8" font-size="10">200 Generic Message</text>

  <!-- Diamond 1 Yes: Generate OTP -->
  <line x1="625" y1="505" x2="625" y2="535" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="635" y="525" fill="#34d399" font-size="12" font-weight="800">YES</text>

  <!-- 3. SecureRandom & Email Service Box -->
  <g transform="translate(115, 540)">
    <rect width="1020" height="115" rx="12" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="115" rx="4" fill="#10b981"/>
    <text x="30" y="30" fill="#f8fafc" font-size="15" font-weight="700">2. CSPRNG OTP Generation &amp; Google SMTP Dispatch</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="13">• Generate 6-Digit Cryptographic Code: <tspan fill="#34d399" font-family="monospace">String.format("%06d", new SecureRandom().nextInt(1_000_000))</tspan></text>
    <text x="30" y="77" fill="#cbd5e1" font-size="13">• Database Update: <tspan fill="#a5b4fc" font-family="monospace">UPDATE users SET reset_token = '481378', reset_token_expiry = now() + interval '15 min'</tspan></text>
    <text x="30" y="99" fill="#cbd5e1" font-size="13">• SMTP Dispatch: <tspan fill="#38bdf8" font-family="monospace">EmailService.sendPasswordResetOtp()</tspan> connects to <tspan fill="#fbbf24" font-family="monospace">smtp.gmail.com:587</tspan> over STARTTLS</text>
  </g>

  <!-- Line from Phase 1 to Phase 2 -->
  <line x1="625" y1="680" x2="625" y2="715" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- ================= STAGE 2: VERIFY OTP ================= -->
  <!-- Subgraph 2: Dedicated OTP Verification Screen -->
  <rect x="75" y="720" width="1100" height="370" rx="20" fill="#0f0f13" stroke="rgba(56,189,248,0.3)" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="105" y="755" fill="#38bdf8" font-size="15" font-weight="700" letter-spacing="1">PHASE 2: DEDICATED 6-BOX OTP VERIFICATION SCREEN</text>

  <!-- 4. Client Step 2 Box -->
  <g transform="translate(115, 775)">
    <rect width="1020" height="85" rx="12" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="85" rx="4" fill="#38bdf8"/>
    <text x="30" y="30" fill="#f8fafc" font-size="16" font-weight="700">3. User Enters 6-Digit OTP Code in Frontend Box UI</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="13">• Next.js 6-box input: Auto-focus next box, paste listener, 60s resend countdown timer</text>
    <text x="30" y="75" fill="#cbd5e1" font-size="13">• Frontend dispatches: <tspan fill="#38bdf8" font-family="monospace">POST /api/auth/verify-otp • Body: { "email": "...", "otp": "481378" }</tspan></text>
  </g>

  <!-- Line to Diamond 2 -->
  <line x1="625" y1="860" x2="625" y2="890" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- Diamond 2: Is OTP Valid & < 15m? -->
  <g transform="translate(625, 935)">
    <path d="M 0 -35 L 160 0 L 0 35 L -160 0 Z" fill="url(#diamondGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Does OTP Match &amp;</text>
    <text x="0" y="14" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="700">Expiry &gt; LocalDateTime.now()?</text>
  </g>

  <!-- Diamond 2 No: Throw BadRequestException -->
  <line x1="465" y1="935" x2="260" y2="935" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="110" y="910" width="140" height="50" rx="8" fill="#18181b" stroke="#f87171" stroke-width="1.5"/>
  <text x="180" y="931" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">NO (400 Bad Request)</text>
  <text x="180" y="949" text-anchor="middle" fill="#94a3b8" font-size="10">Invalid / Expired OTP</text>

  <!-- Diamond 2 Yes: Unlock Password Step -->
  <line x1="625" y1="970" x2="625" y2="1000" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="635" y="990" fill="#34d399" font-size="12" font-weight="800">YES (200 OK)</text>

  <!-- 5. Step 2 Success Box -->
  <g transform="translate(250, 1005)">
    <rect width="750" height="60" rx="10" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
    <text x="375" y="27" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">✓ OTP Code Verified Successfully!</text>
    <text x="375" y="47" text-anchor="middle" fill="#cbd5e1" font-size="12">Next.js UI advances to Step 3: Dedicated "Set New Password" Screen</text>
  </g>

  <!-- Line from Phase 2 to Phase 3 -->
  <line x1="625" y1="1090" x2="625" y2="1125" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 3: RESET PASSWORD ================= -->
  <!-- Subgraph 3: Password Reset & Security Invalidation -->
  <rect x="75" y="1130" width="1100" height="420" rx="20" fill="#0f0f13" stroke="rgba(168,85,247,0.3)" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="105" y="1165" fill="#c084fc" font-size="15" font-weight="700" letter-spacing="1">PHASE 3: BCRYPT ENCRYPTION &amp; ENTERPRISE SESSION INVALIDATION</text>

  <!-- 6. Client Step 3 Box -->
  <g transform="translate(115, 1185)">
    <rect width="1020" height="85" rx="12" fill="url(#boxGrad)" stroke="#a855f7" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="85" rx="4" fill="#a855f7"/>
    <text x="30" y="30" fill="#f8fafc" font-size="16" font-weight="700">4. User Sets New Password &amp; Confirm Password</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="13">• Next.js validates min 6 characters and password matching with eye show/hide toggle</text>
    <text x="30" y="75" fill="#cbd5e1" font-size="13">• Dispatches: <tspan fill="#c084fc" font-family="monospace">POST /api/auth/reset-password • Body: { "email": "...", "otp": "481378", "newPassword": "..." }</tspan></text>
  </g>

  <!-- Line to Diamond 3 -->
  <line x1="625" y1="1270" x2="625" y2="1300" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Diamond 3: Do Passwords Match? -->
  <g transform="translate(625, 1345)">
    <path d="M 0 -35 L 140 0 L 0 35 L -140 0 Z" fill="url(#diamondGrad)" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Do Passwords Match</text>
    <text x="0" y="14" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="700">&amp; Length &gt;= 6?</text>
  </g>

  <!-- Diamond 3 No -->
  <line x1="485" y1="1345" x2="260" y2="1345" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="110" y="1320" width="140" height="50" rx="8" fill="#18181b" stroke="#f87171" stroke-width="1.5"/>
  <text x="180" y="1341" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">NO (400 Bad Request)</text>
  <text x="180" y="1359" text-anchor="middle" fill="#94a3b8" font-size="10">Password Mismatch</text>

  <!-- Diamond 3 Yes -->
  <line x1="625" y1="1380" x2="625" y2="1410" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="635" y="1400" fill="#34d399" font-size="12" font-weight="800">YES</text>

  <!-- 7. Security Sanitization Box -->
  <g transform="translate(115, 1415)">
    <rect width="1020" height="115" rx="12" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="115" rx="4" fill="#10b981"/>
    <text x="30" y="30" fill="#f8fafc" font-size="15" font-weight="700">5. BCrypt Encryption, Token Burning &amp; Session Invalidation</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="13">• Password Hashed: <tspan fill="#34d399" font-family="monospace">passwordEncoder.encode(newPassword)</tspan> generating unique salted hash ($2a$10$...)</text>
    <text x="30" y="77" fill="#cbd5e1" font-size="13">• Database Sanitization: <tspan fill="#a5b4fc" font-family="monospace">UPDATE users SET password_hash = '$2a$10$...', reset_token = NULL, reset_token_expiry = NULL</tspan></text>
    <text x="30" y="99" fill="#cbd5e1" font-size="13">• Session Invalidation: <tspan fill="#fbbf24" font-family="monospace">SET password_changed_at = now(), failed_login_attempts = 0, lockout_until = NULL</tspan></text>
  </g>

  <!-- Line to Final Success Box -->
  <line x1="625" y1="1550" x2="625" y2="1590" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- ================= FINAL STATE ================= -->
  <g transform="translate(325, 1600)">
    <rect width="600" height="85" rx="14" fill="url(#emeraldGrad)" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
    <text x="300" y="35" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">🎉 Step 4: Password Successfully Reset!</text>
    <text x="300" y="60" text-anchor="middle" fill="#ecfdf5" font-size="13">Prior JWTs Invalidated • Account Unlocked • Redirect to /login</text>
  </g>
</svg>
