<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="1200" height="1350" style="background:#09090b; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="50" y="30" width="1100" height="90" rx="16" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="70" text-anchor="middle" fill="url(#headerGrad)" font-size="26" font-weight="800" letter-spacing="0.5">SPRING BOOT WEB &amp; SECURITY FILTER PIPELINE</text>
  <text x="600" y="98" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="500">ASCEND Enterprise Performance Management System • End-to-End Tracing &amp; Role-Based Access Control</text>

  <!-- 1. Client Request Box -->
  <g transform="translate(300, 150)">
    <rect width="600" height="80" rx="14" fill="url(#primaryGrad)" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="300" y="35" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">🌐 Incoming HTTP Client Request (Next.js 16 / Swagger)</text>
    <text x="300" y="60" text-anchor="middle" fill="#e0e7ff" font-size="13" font-family="monospace">Header: [Authorization: Bearer &lt;JWT&gt;] • [Optional: X-Request-ID]</text>
  </g>

  <!-- Line 1 to 2 -->
  <line x1="600" y1="230" x2="600" y2="265" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Subgraph Container -->
  <rect x="80" y="270" width="1040" height="880" rx="20" fill="#0f0f13" stroke="rgba(99,102,241,0.3)" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="110" y="305" fill="#818cf8" font-size="16" font-weight="700" letter-spacing="1">SPRING SECURITY FILTER CHAIN &amp; OBSERVABILITY PIPELINE</text>

  <!-- 2. CorrelationIdFilter -->
  <g transform="translate(140, 325)">
    <rect width="920" height="95" rx="12" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="95" rx="4" fill="#6366f1"/>
    <text x="30" y="30" fill="#f8fafc" font-size="16" font-weight="700">1. CorrelationIdFilter</text>
    <rect x="220" y="14" width="230" height="22" rx="6" fill="rgba(99,102,241,0.2)" stroke="#818cf8"/>
    <text x="335" y="29" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="700">@Order(Ordered.HIGHEST_PRECEDENCE)</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="13">• Inspects incoming header <tspan fill="#a5b4fc" font-family="monospace">X-Request-ID</tspan> or generates fresh <tspan fill="#a5b4fc" font-family="monospace">UUID.randomUUID()</tspan></text>
    <text x="30" y="78" fill="#cbd5e1" font-size="13">• Sets <tspan fill="#34d399" font-family="monospace">MDC.put("requestId", correlationId)</tspan> for distributed logging • Appends to Response • Cleaned up in <tspan fill="#fbbf24" font-family="monospace">finally</tspan></text>
  </g>

  <!-- Line 2 to 3 -->
  <line x1="600" y1="420" x2="600" y2="455" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. CorsFilter -->
  <g transform="translate(140, 460)">
    <rect width="920" height="75" rx="12" fill="url(#boxGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="75" rx="4" fill="#38bdf8"/>
    <text x="30" y="30" fill="#f8fafc" font-size="16" font-weight="700">2. CorsFilter (Cross-Origin Resource Sharing)</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="13">• Allowed Origins: <tspan fill="#38bdf8" font-family="monospace">http://localhost:3000</tspan> • Allowed Headers: <tspan font-family="monospace">Authorization, Content-Type, X-Request-ID</tspan></text>
  </g>

  <!-- Line 3 to 4 -->
  <line x1="600" y1="535" x2="600" y2="570" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4. Public Route Diamond -->
  <g transform="translate(390, 575)">
    <polygon points="210,0 420,45 210,90 0,45" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="210" y="42" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Is Public Route?</text>
    <text x="210" y="60" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="monospace">/api/auth/**, /swagger-ui/**</text>
  </g>

  <!-- Bypass Line to Controller -->
  <path d="M 810 620 L 980 620 L 980 1195 L 850 1195" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowGreen)"/>
  <text x="900" y="610" fill="#34d399" font-size="12" font-weight="700">YES (PermitAll)</text>

  <!-- Protected Line Down -->
  <line x1="600" y1="665" x2="600" y2="700" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="615" y="685" fill="#a5b4fc" font-size="12" font-weight="700">NO (Protected)</text>

  <!-- 5. JwtAuthenticationFilter -->
  <g transform="translate(140, 705)">
    <rect width="920" height="95" rx="12" fill="url(#boxGrad)" stroke="#a855f7" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="95" rx="4" fill="#a855f7"/>
    <text x="30" y="30" fill="#f8fafc" font-size="16" font-weight="700">3. JwtAuthenticationFilter (OncePerRequestFilter)</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="13">• Extracts Bearer token • Validates HMAC-SHA secret key signature &amp; verifies expiration &gt; now</text>
    <text x="30" y="78" fill="#cbd5e1" font-size="13">• Resolves User Claims: <tspan fill="#c084fc" font-family="monospace">userId (53), email ('karthik@...'), role ('ROLE_MANAGER')</tspan></text>
  </g>

  <!-- 401 Unauthorized Error Branch -->
  <path d="M 140 752 L 50 752 L 50 1200 L 250 1200" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <text x="60" y="742" fill="#f87171" font-size="12" font-weight="700">Invalid / Expired</text>
  <g transform="translate(260, 1175)">
    <rect width="220" height="50" rx="10" fill="#271418" stroke="#ef4444" stroke-width="1.5"/>
    <text x="110" y="30" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">⛔ 401 Unauthorized</text>
  </g>

  <!-- Line 5 to 6 -->
  <line x1="600" y1="800" x2="600" y2="835" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 6. SecurityContextHolder -->
  <g transform="translate(140, 840)">
    <rect width="920" height="75" rx="12" fill="url(#boxGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="75" rx="4" fill="#34d399"/>
    <text x="30" y="30" fill="#f8fafc" font-size="16" font-weight="700">4. SecurityContextHolder Injection</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="13">• Injects <tspan fill="#34d399" font-family="monospace">UsernamePasswordAuthenticationToken(principal, credentials, authorities)</tspan> into ThreadLocal</text>
  </g>

  <!-- Line 6 to 7 -->
  <line x1="600" y1="915" x2="600" y2="950" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 7. AuthorizationFilter -->
  <g transform="translate(140, 955)">
    <rect width="920" height="85" rx="12" fill="url(#boxGrad)" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="85" rx="4" fill="#eab308"/>
    <text x="30" y="30" fill="#f8fafc" font-size="16" font-weight="700">5. AuthorizationFilter (URL Pattern Role Matching)</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="13">• <tspan font-family="monospace">/api/hr/**</tspan> → <tspan fill="#f472b6">ROLE_HR</tspan> • <tspan font-family="monospace">/api/manager/**</tspan> → <tspan fill="#818cf8">ROLE_MANAGER</tspan> • <tspan font-family="monospace">/api/employee/**</tspan> → <tspan fill="#34d399">ROLE_EMPLOYEE</tspan></text>
  </g>

  <!-- Line 7 to 8 -->
  <line x1="600" y1="1040" x2="600" y2="1075" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 8. Method Security Check -->
  <g transform="translate(360, 1080)">
    <polygon points="240,0 480,40 240,80 0,40" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="240" y="35" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Method Security Check</text>
    <text x="240" y="55" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="monospace">@PreAuthorize("hasRole('MANAGER')")</text>
  </g>

  <!-- 403 Forbidden Error Branch -->
  <path d="M 360 1120 L 150 1120 L 150 1200 L 250 1200" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <text x="160" y="1110" fill="#f87171" font-size="12" font-weight="700">Role Mismatch</text>
  <g transform="translate(50, 1175)">
    <rect width="180" height="50" rx="10" fill="#271418" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="30" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">⛔ 403 Forbidden</text>
  </g>

  <!-- Line 8 to Controller -->
  <line x1="600" y1="1160" x2="600" y2="1195" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="615" y="1180" fill="#34d399" font-size="12" font-weight="700">Role Verified</text>

  <!-- 9. Target REST Controller & Service -->
  <g transform="translate(510, 1200)">
    <rect width="340" height="85" rx="14" fill="url(#primaryGrad)" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="170" y="35" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">🎯 Target Controller &amp; Service</text>
    <text x="170" y="60" text-anchor="middle" fill="#e0e7ff" font-size="12" font-family="monospace">SecurityUtils.getCurrentUserId() + MDC Logs</text>
  </g>
</svg>
