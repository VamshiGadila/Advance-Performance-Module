# ==============================
# DEV PROFILE
# Local development against a local MySQL instance.
# Verbose SQL logging and auto schema updates are convenient
# while iterating, but must NOT be used in production.
# ==============================

# ------------------------------
# MySQL
# ------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hrmspolicies2?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------
# JPA / Hibernate
# ddl-auto=update: lets Hibernate evolve the schema automatically
# while developing (never use "update" in production).
# ------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ------------------------------
# Logging - verbose for local debugging
# ------------------------------
logging.level.root=INFO
logging.level.com.example.hrmspolicies2=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO
