# ==============================
# DEV PROFILE
# Local development against a local MySQL instance.
# Verbose SQL logging and auto schema updates are convenient
# while iterating, but must NOT be used in production.
# ==============================

# ------------------------------
# PostgreSQL
# ------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hrms_policies_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------
# JPA / Hibernate
# ------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------
# Logging - verbose for local debugging
# ------------------------------
logging.level.root=INFO
logging.level.com.example.hrmspolicies2=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO
