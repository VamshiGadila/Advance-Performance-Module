# ==============================
# COMMON CONFIGURATION
# (shared by every profile; profile-specific files override
# individual keys - see application-dev.properties / application-prod.properties)
# ==============================

spring.application.name=hrmspolicies2

server.port=${SERVER_PORT:8081}

# Active profile - override with:
#   java -jar app.jar --spring.profiles.active=prod
#   or environment variable SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==============================
# JWT (externalized - never hardcode secrets in real deployments;
# override JWT_SECRET via an environment variable in production)
# ==============================
jwt.secret=${JWT_SECRET:MySuperSecretKeyForHrmsPolicies2ApplicationJwtToken2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================
# CORS
# ==============================
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ==============================
# Google OAuth 2.0 Client Configuration
# ==============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.oauth2.authorized-redirect-uri=${FRONTEND_OAUTH_REDIRECT_URI:http://localhost:3001/login}

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==============================
# Jackson
# ==============================
spring.jackson.default-property-inclusion=non_null
