# ==============================
# PROD PROFILE
# All values are expected to come from environment variables /
# a secrets manager - nothing sensitive is hardcoded here.
# ==============================

# ------------------------------
# MySQL
# ------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------
# JPA / Hibernate
# ddl-auto=validate: the schema must already exist (via migration
# scripts / database/schema.sql) - the app only verifies it matches,
# it never auto-alters production tables.
# ------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ------------------------------
# Logging - quieter, no SQL bodies, no framework debug noise
# ------------------------------
logging.level.root=WARN
logging.level.com.example.hrmspolicies2=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# ------------------------------
# Swagger UI is left enabled here for demo purposes; in a real
# production deployment consider disabling it:
# springdoc.swagger-ui.enabled=false
# ------------------------------
